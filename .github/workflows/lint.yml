name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck --version && shellcheck scripts/*.sh

      - name: Validate workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          failed = False
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(path, encoding="utf-8") as handle:
                      yaml.safe_load(handle)
              except Exception as exc:  # noqa: BLE001
                  failed = True
                  print(f"invalid: {path}: {exc}")
              else:
                  print(f"ok: {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "ok: $script"
          done

      - name: Firmware preflight smoke test
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/images"
          printf 'fake system image' > "$work/images/system.img"
          tar -czf "$work/firmware.tgz" -C "$work/images" system.img
          FIRMWARE="$work/firmware.tgz" bash scripts/preflight-firmware.sh

          printf 'not a gzip stream' > "$work/broken.tgz"
          if FIRMWARE="$work/broken.tgz" bash scripts/preflight-firmware.sh; then
            echo "expected a corrupt .tgz to fail preflight" >&2
            exit 1
          fi
