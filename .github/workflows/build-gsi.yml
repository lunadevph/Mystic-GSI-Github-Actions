name: Build GSI from OEM firmware

# Thin wrapper around MysticGSI (https://github.com/MysticGSI/mysticgsi).
# All extraction, patching, and image generation is done by MysticGSI itself.

on:
  workflow_dispatch:
    inputs:
      name:
        description: Build name (letters, digits, dot, dash, underscore; max 64)
        required: true
        default: mystic
        type: string
      firmware:
        description: Firmware URL, or path on the runner (path needs a self-hosted runner)
        required: true
        type: string
      type:
        description: ROM type (auto detects; set explicitly if detection fails)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - generic
          - custom
          - pixel
          - alos
          - emui
          - magicos
          - harmonyos
          - zui
          - nothing
          - realmeui
          - oxygenos
          - coloros
          - oneui
          - miui
          - hyperos
          - joyui
          - myos
          - redmagic
          - nebulaos
      type_override:
        description: Optional TYPE:OVERRIDE suffix (only used with auto/generic/custom)
        required: false
        default: ""
        type: string
      format:
        description: Output filesystem
        required: true
        type: choice
        default: ext4
        options:
          - ext4
          - lz4
          - lz4hc
          - lzma
      compress:
        description: Also produce a ZIP next to the image
        required: true
        type: boolean
        default: true
      no_debloat:
        description: Keep the apps MysticGSI would otherwise remove
        required: true
        type: boolean
        default: false
      no_merge:
        description: Keep separate partitions instead of merging into system
        required: true
        type: boolean
        default: false
      add_tag:
        description: Tag appended to the build display name
        required: false
        default: ""
        type: string
      mystic_ref:
        description: MysticGSI branch, tag, or full commit SHA
        required: true
        default: main
        type: string
      runner:
        description: Runner label (large firmware needs disk; self-hosted recommended)
        required: true
        default: ubuntu-24.04
        type: string
      upload_release:
        description: Publish a GitHub release with the image
        required: true
        type: boolean
        default: true
      retention_days:
        description: Artifact retention in days
        required: false
        default: 14
        type: number

concurrency:
  group: mysticgsi-${{ github.ref }}-${{ inputs.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Convert firmware
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      artifact: ${{ steps.meta.outputs.artifact }}
      commit: ${{ steps.fetch.outputs.commit }}

    env:
      MYSTIC_DIR: ${{ github.workspace }}/mysticgsi
      MYSTIC_REF: ${{ inputs.mystic_ref }}
      BUILD_NAME: ${{ inputs.name }}
      FIRMWARE: ${{ inputs.firmware }}
      TYPE: "${{ inputs.type_override != '' && format('{0}:{1}', inputs.type, inputs.type_override) || inputs.type }}"
      FORMAT: ${{ inputs.format }}
      COMPRESS: ${{ inputs.compress }}
      NO_DEBLOAT: ${{ inputs.no_debloat }}
      NO_MERGE: ${{ inputs.no_merge }}
      ADD_TAG: ${{ inputs.add_tag }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out wrapper
        uses: actions/checkout@v4

      - name: Prepare metadata
        id: meta
        run: |
          set -euo pipefail
          if ! [[ "${BUILD_NAME}" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::Invalid build name '${BUILD_NAME}' (letters, digits, dot, dash, underscore; max 64)"
            exit 1
          fi
          stamp="$(date -u +%Y%m%d-%H%M)"
          echo "tag=mystic-gsi-${BUILD_NAME}-${stamp}" >> "$GITHUB_OUTPUT"
          echo "artifact=mystic-gsi-${BUILD_NAME}-${stamp}" >> "$GITHUB_OUTPUT"
          # Avoid leaking signed-URL credentials into logs.
          case "${FIRMWARE}" in
            *token=* | *sig=* | *X-Amz-*) echo "::add-mask::${FIRMWARE}" ;;
          esac
          echo "Build name: ${BUILD_NAME}"
          echo "Firmware: ${FIRMWARE%%\?*}"

      - name: Free disk space
        run: bash scripts/free-disk.sh

      - name: Fetch MysticGSI
        id: fetch
        run: bash scripts/fetch-mysticgsi.sh

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('mysticgsi/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Set up MysticGSI
        run: bash scripts/setup-mysticgsi.sh

      - name: Prepare AVB key
        env:
          AVB_KEY_PEM: ${{ secrets.MYSTIC_AVB_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AVB_KEY_PEM:-}" ]; then
            echo "MYSTIC_AVB_KEY not set; MysticGSI will use its bundled AOSP test key."
            exit 0
          fi
          key="${RUNNER_TEMP}/avb-key.pem"
          umask 077
          first_line="${AVB_KEY_PEM%%$'\n'*}"
          if [[ "${first_line}" == *"BEGIN "*"PRIVATE KEY"* ]]; then
            printf '%s\n' "${AVB_KEY_PEM}" > "${key}"
          else
            printf '%s' "${AVB_KEY_PEM}" | base64 -d > "${key}"
          fi
          openssl pkey -in "${key}" -noout
          echo "AVB_KEY=${key}" >> "$GITHUB_ENV"
          echo "Using a custom AVB signing key."

      - name: Build GSI
        run: bash scripts/build-gsi.sh

      - name: Collect outputs
        run: bash scripts/collect-outputs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}-logs
          path: mysticgsi/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Summarize
        if: always()
        run: |
          {
            echo "## MysticGSI build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Build name | \`${BUILD_NAME}\` |"
            echo "| ROM type | \`${TYPE}\` |"
            echo "| Format | \`${FORMAT}\` |"
            echo "| Compress | \`${COMPRESS}\` |"
            echo "| Upstream commit | \`${{ steps.fetch.outputs.commit }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Status | ${{ job.status }} |"
            echo ""
            echo "Firmware: \`${FIRMWARE%%\?*}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -d artifacts ]; then
            {
              echo ""
              echo "### Artifacts"
              echo '```'
              find artifacts -type f -printf '%10s  %p\n' | sort -k2
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f mysticgsi/build.log ]; then
            {
              echo ""
              echo "<details><summary>Build log (tail)</summary>"
              echo ""
              echo '```'
              tail -n 80 mysticgsi/build.log
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish release
    needs: build
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: MysticGSI ${{ inputs.name }} (${{ needs.build.outputs.tag }})
          body: |
            Built from OEM firmware with [MysticGSI](https://github.com/MysticGSI/mysticgsi) at `${{ needs.build.outputs.commit }}`.

            - Build name: `${{ inputs.name }}`
            - ROM type: `${{ inputs.type }}`
            - Format: `${{ inputs.format }}`
            - Compress: `${{ inputs.compress }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
